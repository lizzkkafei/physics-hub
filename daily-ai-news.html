<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日 AI 资讯 TOP10 — Knowledge Hub</title>
  <style>
    /* ========== Design Tokens ========== */
    :root {
      --primary: #00D4AA;
      --primary-dim: rgba(0, 212, 170, 0.12);
      --primary-glow: rgba(0, 212, 170, 0.25);
      --secondary: #6366F1;
      --secondary-dim: rgba(99, 102, 241, 0.12);
      --bg: #080A12;
      --card: #111420;
      --card-hover: #161929;
      --card-border: rgba(255, 255, 255, 0.06);
      --text: #ECF1F7;
      --text-muted: #8892A8;
      --text-dim: #5A6377;
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.05);
      --radius: 14px;
      --radius-sm: 8px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ========== Reset & Base ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      padding: 20px 16px;
    }

    /* Background mesh */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(0, 212, 170, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(99, 102, 241, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 20% 80%, rgba(0, 212, 170, 0.03) 0%, transparent 50%);
    }

    ::selection { background: var(--primary-dim); color: var(--primary); }

    .container { max-width: 820px; margin: 0 auto; }

    /* ========== Top Nav ========== */
    .top-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .top-nav .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text-muted); font-size: 14px; text-decoration: none;
      padding: 6px 12px; border-radius: var(--radius-sm);
      background: var(--card); border: 1px solid var(--border);
      transition: all 0.2s var(--ease-out);
    }
    .top-nav .back-link:hover { color: var(--primary); border-color: var(--primary-dim); }
    .top-nav .brand { font-size: 13px; color: var(--text-dim); margin-left: auto; }

    /* ========== Header ========== */
    .header {
      text-align: center; padding: 40px 20px 20px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 24px;
    }
    .header h1 {
      font-size: 2rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--primary) 0%, #4FD1C5 30%, var(--secondary) 80%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .subtitle { margin-top: 8px; font-size: 0.95rem; color: var(--text-muted); }
    .date-badge {
      display: inline-block; margin-top: 10px; padding: 4px 18px;
      border-radius: 20px; background: var(--secondary-dim);
      color: var(--secondary); font-size: 0.85rem; font-weight: 500;
    }

    /* ========== Voice Controls ========== */
    .voice-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; flex-wrap: wrap; padding: 14px 20px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-sm); margin-bottom: 24px;
    }
    .voice-bar .label { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }

    .voice-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 0.9rem; font-weight: 500; cursor: pointer;
      transition: all 0.2s var(--ease-out);
      background: var(--bg); color: var(--text-muted); font-family: inherit;
    }
    .voice-btn:hover { transform: translateY(-1px); border-color: var(--text-dim); color: var(--text); }
    .voice-btn:active { transform: scale(0.96); }
    .voice-btn.primary { background: var(--primary); color: #080A12; border-color: var(--primary); font-weight: 600; }
    .voice-btn.primary:hover { box-shadow: 0 4px 20px var(--primary-glow); }
    .voice-btn.danger { background: #EF4444; color: #fff; border-color: #EF4444; }
    .voice-btn.danger:hover { box-shadow: 0 4px 16px rgba(239,68,68,0.35); }
    .voice-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

    .voice-status { font-size: 0.82rem; color: var(--text-dim); text-align: center; padding: 4px 0 0; }
    .voice-status .highlight { color: var(--primary); font-weight: 500; }

    /* ========== Progress Bar ========== */
    .progress-wrap {
      width: 100%; height: 3px; background: var(--border);
      border-radius: 2px; overflow: hidden; margin: 8px 0 0;
    }
    .progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 2px; transition: width 0.3s linear;
    }

    /* ========== News List ========== */
    .news-list { list-style: none; }

    .news-item {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 22px 24px;
      margin-bottom: 14px; position: relative;
      transition: all 0.3s var(--ease-out);
      border-left: 3px solid transparent;
    }
    .news-item:hover {
      border-color: rgba(0, 212, 170, 0.15);
      background: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .news-item.playing {
      border-left-color: var(--primary) !important;
      background: var(--card-hover);
      box-shadow: 0 6px 24px rgba(0, 212, 170, 0.1);
    }
    .news-item.playing .news-title { color: var(--primary); }

    .news-rank {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--secondary); color: #fff;
      font-weight: 700; font-size: 0.85rem;
      margin-right: 12px; flex-shrink: 0;
    }
    .news-rank.top3 { width: 36px; height: 36px; font-size: 1rem; background: var(--primary); color: #080A12; }

    .news-head { display: flex; align-items: flex-start; gap: 4px; }
    .news-title-area { flex: 1; min-width: 0; }
    .news-title { font-size: 1.08rem; font-weight: 600; color: var(--text); line-height: 1.4; }

    .read-single-btn {
      flex-shrink: 0; width: 34px; height: 34px; border: 1px solid var(--border);
      border-radius: 50%; background: var(--bg); color: var(--text-muted);
      font-size: 1rem; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; justify-content: center; margin-left: 8px;
    }
    .read-single-btn:hover { background: var(--primary-dim); color: var(--primary); border-color: var(--primary); }
    .read-single-btn:active { transform: scale(0.9); }
    .read-single-btn.playing {
      background: #EF4444; color: #fff; border-color: #EF4444;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }

    .news-desc {
      margin-top: 10px; font-size: 0.93rem; color: var(--text-muted);
      line-height: 1.7; padding-left: 44px;
    }
    .news-item.playing .news-desc { color: var(--text); }

    /* ========== Footer ========== */
    .footer { text-align: center; padding: 28px 16px 10px; font-size: 0.82rem; color: var(--text-dim); }
    .update-tip {
      display: inline-block; padding: 8px 20px;
      background: var(--card); border-radius: 10px;
      font-size: 0.85rem; color: var(--text-dim);
      border: 1px dashed var(--border);
    }
    .update-tip code {
      background: var(--bg); padding: 1px 6px;
      border-radius: 4px; font-size: 0.82rem; color: var(--secondary);
    }

    /* ========== Responsive ========== */
    @media (max-width: 600px) {
      body { padding: 12px 10px; }
      .header { padding: 28px 14px 18px; }
      .header h1 { font-size: 1.5rem; }
      .news-item { padding: 16px; }
      .news-title { font-size: 1rem; }
      .news-desc { font-size: 0.88rem; padding-left: 0; margin-top: 8px; }
      .voice-bar { flex-direction: column; gap: 8px; }
      .voice-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ==================== Top Navigation ==================== -->
  <div class="top-nav">
    <a href="/" class="back-link">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3L5 7l4 4"/>
      </svg>
      返回首页
    </a>
    <span class="brand">Knowledge Hub</span>
  </div>

  <!-- ==================== 顶部标题栏 ==================== -->
  <header class="header">
    <h1>🔥 每日 AI 资讯 TOP10</h1>
    <p class="subtitle">精选当日全球人工智能领域最值得关注的热点</p>
    <span class="date-badge" id="dateBadge"></span>
  </header>

  <!-- ==================== 全局语音播放控件 ==================== -->
  <div class="voice-bar">
    <span class="label">🔊 语音朗读</span>
    <button class="voice-btn primary" id="playAllBtn" title="按顺序朗读全部10条资讯">▶ 朗读全部</button>
    <button class="voice-btn" id="pauseBtn" title="暂停 / 继续">⏸ 暂停</button>
    <button class="voice-btn danger" id="stopBtn" title="停止朗读并复位">⏹ 停止</button>
    <!-- 播放进度条 -->
    <div class="progress-wrap" style="flex:1; min-width:120px; margin:0;">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>
  <div class="voice-status" id="voiceStatus">就绪 — 点击「朗读全部」或每条资讯旁的播音图标 🎧</div>

  <!-- ==================== TOP10 AI 资讯列表 ==================== -->
  <ul class="news-list" id="newsList"></ul>

  <!-- ==================== 底部 更新预留区 ==================== -->
  <div class="footer">
    <div class="update-tip">
      ✏️ 每日更新入口 — 修改下方 JS 中 <code>newsData</code> 数组即可替换资讯内容
    </div>
    <p style="margin-top:12px;">&copy; 每日 AI 资讯 &middot; 语音由 edge-tts 神经语音合成</p>
  </div>

</div>

<script>
(function() {
  'use strict';

  // ================================================================
  //  📦 每日资讯数据
  //  ★ 修改这里即可每日更新内容 ★
  //  格式：{ rank, title, desc, voiceFile }
  //     voiceFile: 语音文件路径（相对网页文件的位置）
  // ================================================================
  var newsData = [
    {
      rank: 1,
      title: 'OpenAI 发布 GPT-5，推理能力大幅跃升',
      desc: 'OpenAI 正式推出 GPT-5 模型，在数学推理、代码生成和多模态理解方面实现显著突破。新模型支持更长的上下文窗口，并能自主调用工具完成复杂任务，性能全面超越前代，引发行业广泛讨论。',
      voiceFile: 'voices/voice_01.mp3'
    },
    {
      rank: 2,
      title: 'Google DeepMind 推出 Gemini 2.0 超大规模模型',
      desc: 'Google DeepMind 发布 Gemini 2.0，采用全新的 MoE 架构，参数规模达到万亿级别。在多项基准测试中刷新纪录，尤其在高难度数学和科学推理任务上表现突出，同时大幅降低推理成本。',
      voiceFile: 'voices/voice_02.mp3'
    },
    {
      rank: 3,
      title: 'Anthropic 发布 Claude 4，安全与能力再升级',
      desc: 'Anthropic 推出 Claude 4 系列模型，在长文本理解、代码执行和多步骤推理方面取得重大进展。新模型引入了更先进的宪法 AI 机制，在保持高安全标准的同时实现了更强的实用性。',
      voiceFile: 'voices/voice_03.mp3'
    },
    {
      rank: 4,
      title: 'Meta 开源 Llama 4，推动大模型民主化',
      desc: 'Meta 宣布开源 Llama 4 系列大语言模型，包含多个参数规模的版本。新模型在多语言能力和代码生成方面表现优异，延续开源战略，为全球开发者社区提供了强大的基础模型选择。',
      voiceFile: 'voices/voice_04.mp3'
    },
    {
      rank: 5,
      title: '特斯拉 Optimus 机器人开始工厂试点应用',
      desc: '特斯拉 Optimus 人形机器人在得克萨斯超级工厂启动试点，承担零部件搬运和分拣任务。马斯克表示 Optimus 已具备初步实用能力，计划明年在内部工厂大规模部署数千台。',
      voiceFile: 'voices/voice_05.mp3'
    },
    {
      rank: 6,
      title: 'Runway 发布 Gen-4 视频生成模型，影视级效果',
      desc: 'Runway 推出 Gen-4 视频生成模型，支持生成 1080p 分辨率、时长超过 60 秒的高质量视频。在镜头运动、光影一致性和人物表情细腻度上达到新高度，被多家影视工作室采用。',
      voiceFile: 'voices/voice_06.mp3'
    },
    {
      rank: 7,
      title: '苹果 AI 战略提速，自研大模型融入全系设备',
      desc: '苹果加速 AI 布局，新一代 A19 和 M5 芯片集成更强神经网络引擎，端侧大模型性能提升 3 倍。Siri 全面接入自研大模型，支持离线复杂指令处理，标志苹果 AI 战略进入新阶段。',
      voiceFile: 'voices/voice_07.mp3'
    },
    {
      rank: 8,
      title: '微软 Copilot 全面升级，深度集成 Office 全家桶',
      desc: '微软宣布 Copilot 重大更新，深度集成 Word、Excel、PowerPoint 和 Teams。新版本支持跨应用工作流编排，可根据自然语言指令自动完成数据分析、文档编写和会议纪要生成。',
      voiceFile: 'voices/voice_08.mp3'
    },
    {
      rank: 9,
      title: '国内 AI 大模型竞争白热化，多款产品对标 GPT-4',
      desc: '百度文心一言 4.0、阿里通义千问 2.5、字节豆包大模型、腾讯混元等国产大模型密集发布更新，在中文理解和推理能力上持续逼近 GPT-4 水平。开源生态同步繁荣，多家企业推出免费 API 服务。',
      voiceFile: 'voices/voice_09.mp3'
    },
    {
      rank: 10,
      title: 'AI 安全成全球焦点，多国启动立法进程',
      desc: '欧盟 AI 法案正式生效后，美国、英国、日本等国加速制定 AI 监管框架。围绕深度伪造检测、算法透明度和版权保护等议题，各国政府与企业间的博弈日益激烈，AI 安全治理成为行业核心议题。',
      voiceFile: 'voices/voice_10.mp3'
    }
  ];

  // ================================================================
  //  DOM 元素
  // ================================================================
  var newsListEl   = document.getElementById('newsList');
  var dateBadge    = document.getElementById('dateBadge');
  var voiceStatus  = document.getElementById('voiceStatus');
  var playAllBtn   = document.getElementById('playAllBtn');
  var pauseBtn     = document.getElementById('pauseBtn');
  var stopBtn      = document.getElementById('stopBtn');
  var progressBar  = document.getElementById('progressBar');

  // ================================================================
  //  🎵 音频引擎状态
  // ================================================================
  var audio        = new Audio();        // 全局唯一 Audio 实例
  var isPlaying    = false;              // 是否正在播放
  var isQueueMode  = false;              // 队列模式（全部朗读）
  var queue        = [];                 // 待播索引队列
  var currentIdx   = -1;                 // 当前播放的索引
  var progressTimer= null;               // 进度条更新定时器

  // ================================================================
  //  🏗 渲染资讯列表
  // ================================================================
  function renderNews() {
    var html = '';
    for (var i = 0; i < newsData.length; i++) {
      var item = newsData[i];
      var rankClass = item.rank <= 3 ? 'news-rank top3' : 'news-rank';
      html += '<li class="news-item" data-index="' + i + '">' +
        '<div class="news-head">' +
          '<span class="' + rankClass + '">' + item.rank + '</span>' +
          '<div class="news-title-area">' +
            '<div class="news-title">' + escapeHtml(item.title) + '</div>' +
          '</div>' +
          '<button class="read-single-btn" data-index="' + i + '" title="朗读本条">🔊</button>' +
        '</div>' +
        '<div class="news-desc">' + escapeHtml(item.desc) + '</div>' +
      '</li>';
    }
    newsListEl.innerHTML = html;

    // 绑定单条朗读按钮
    var btns = newsListEl.querySelectorAll('.read-single-btn');
    for (var j = 0; j < btns.length; j++) {
      btns[j].addEventListener('click', function(e) {
        e.stopPropagation();
        var idx = parseInt(this.getAttribute('data-index'), 10);
        playSingle(idx);
      });
    }
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  // ================================================================
  //  📅 日期显示
  // ================================================================
  function updateDateBadge() {
    var d = new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    var weekdays = ['日','一','二','三','四','五','六'];
    var w = weekdays[d.getDay()];
    dateBadge.textContent = y + '年' + m + '月' + day + '日 星期' + w;
  }

  // ================================================================
  //  🔊 音频播放核心
  // ================================================================

  /** 播放指定索引的单条资讯 */
  function playSingle(index) {
    if (index < 0 || index >= newsData.length) return;

    // 如果已经在队列模式且正在播放，先停止
    if (isQueueMode) stopPlayback();

    isQueueMode = false;
    queue = [];
    playAudio(index, false);
  }

  /** 朗读全部（队列模式） */
  function playAll() {
    stopPlayback();
    isQueueMode = true;
    queue = [];
    for (var i = 0; i < newsData.length; i++) queue.push(i);

    if (queue.length === 0) { setStatus('暂无资讯'); return; }

    var first = queue.shift();
    playAudio(first, true);
  }

  /** 核心：播放音频文件 */
  function playAudio(index, isQueue) {
    if (index < 0 || index >= newsData.length) return;

    var item = newsData[index];
    currentIdx = index;

    // 停止旧进度定时器
    clearProgressTimer();

    // 设置音频源
    audio.src = item.voiceFile;
    audio.currentTime = 0;

    // 绑定事件（先清除旧的）
    audio.onended = null;
    audio.onerror = null;
    audio.onpause = null;
    audio.onplay  = null;

    audio.onplay = function() {
      isPlaying = true;
      updateUI();
      // 高亮当前条目
      highlightItem(index, true);
      if (isQueue) {
        setStatus('🔊 正在朗读第 ' + (index + 1) + ' 条 / 共 ' + newsData.length + ' 条');
      } else {
        setStatus('🔊 正在朗读：' + item.title);
      }
      // 启动进度条
      startProgress();
    };

    audio.onended = function() {
      isPlaying = false;
      highlightItem(index, false);
      clearProgressTimer();

      if (isQueue && queue.length > 0) {
        // 队列模式: 播放下一条
        var next = queue.shift();
        playAudio(next, true);
      } else if (isQueue && queue.length === 0) {
        // 全部播完
        isQueueMode = false;
        setStatus('✅ 全部播放完成');
        updateUI();
        resetProgress();
      } else {
        // 单条模式结束
        setStatus('✅ 播放完成');
        updateUI();
        resetProgress();
      }
    };

    audio.onerror = function() {
      console.error('音频加载失败:', item.voiceFile);
      isPlaying = false;
      highlightItem(index, false);
      clearProgressTimer();
      setStatus('⚠️ 音频加载失败: ' + item.voiceFile);

      if (isQueue && queue.length > 0) {
        var next = queue.shift();
        playAudio(next, true);
      } else {
        isQueueMode = false;
        updateUI();
        resetProgress();
      }
    };

    audio.play().catch(function(e) {
      console.warn('自动播放被阻止，等待用户交互:', e);
      setStatus('⚠️ 请先点击页面任意位置激活音频播放');
      isPlaying = false;
      updateUI();
    });
  }

  /** 暂停 / 继续 */
  function togglePause() {
    if (!isPlaying && audio.paused) return;
    if (audio.paused) {
      audio.play().catch(function(){});
      setStatus('▶ 继续播放');
    } else {
      audio.pause();
      setStatus('⏸ 已暂停');
    }
    updateUI();
  }

  /** 停止播放 */
  function stopPlayback() {
    audio.pause();
    audio.currentTime = 0;
    isPlaying = false;
    isQueueMode = false;
    queue = [];
    clearProgressTimer();
    resetProgress();
    // 清除所有高亮
    var items = newsListEl.querySelectorAll('.news-item');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.remove('playing');
    }
    var btns = newsListEl.querySelectorAll('.read-single-btn');
    for (var j = 0; j < btns.length; j++) {
      btns[j].classList.remove('playing');
    }
    updateUI();
  }

  // ================================================================
  //  🎨 高亮 & 进度条
  // ================================================================

  function highlightItem(index, active) {
    var items = newsListEl.querySelectorAll('.news-item');
    var btns  = newsListEl.querySelectorAll('.read-single-btn');
    if (index < 0 || index >= items.length) return;
    if (active) {
      items[index].classList.add('playing');
      if (btns[index]) btns[index].classList.add('playing');
      // 滚动到可视区域
      items[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
      items[index].classList.remove('playing');
      if (btns[index]) btns[index].classList.remove('playing');
    }
  }

  function startProgress() {
    clearProgressTimer();
    updateProgress();
    progressTimer = setInterval(updateProgress, 200);
  }

  function updateProgress() {
    if (audio.duration && !isNaN(audio.duration)) {
      var pct = (audio.currentTime / audio.duration) * 100;
      progressBar.style.width = Math.min(pct, 100) + '%';
    }
  }

  function resetProgress() { progressBar.style.width = '0%'; }

  function clearProgressTimer() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  }

  // ================================================================
  //  🖥 UI 状态更新
  // ================================================================
  function updateUI() {
    var busy = isPlaying || !audio.paused;
    playAllBtn.disabled = busy && !audio.paused;

    if (audio.paused && audio.currentTime > 0 && audio.currentTime < (audio.duration || Infinity)) {
      pauseBtn.textContent = '▶ 继续';
    } else {
      pauseBtn.textContent = '⏸ 暂停';
    }
  }

  function setStatus(msg) { voiceStatus.textContent = msg; }

  // ================================================================
  //  🎯 绑定全局按钮
  // ================================================================
  playAllBtn.addEventListener('click', function() {
    if (isPlaying && !audio.paused) return;
    // 如果暂停中且是队列模式，恢复
    if (audio.paused && audio.currentTime > 0 && isQueueMode) {
      audio.play();
      return;
    }
    playAll();
  });

  pauseBtn.addEventListener('click', togglePause);

  stopBtn.addEventListener('click', function() {
    stopPlayback();
    setStatus('⏹ 已停止');
  });

  // 键盘 Space 暂停/继续
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space') {
      e.preventDefault();
      togglePause();
    }
  });

  // ================================================================
  //  🚀 启动
  // ================================================================
  updateDateBadge();
  renderNews();
  setStatus('就绪 — 点击「朗读全部」或每条资讯旁的播音图标 🎧');

})();
</script>

</body>
</html>
